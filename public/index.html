<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <meta name="theme-color" content="#262626" />
  <meta name="description" content="N3FitBook — Complete gym management software for India. Track members, billing, attendance, expenses & WhatsApp reminders from one platform. Start free." />
  <meta name="keywords" content="gym management software, gym software India, gym CRM, fitness management platform, gym billing software, member management" />
  <meta name="author" content="N3 Global Tech" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

  <!-- Canonical URL — overridden per page by the useDocumentMeta hook for
       sub-routes; defaults here to the homepage so the source HTML always
       has a valid canonical for crawlers that don't run JS. -->
  <link rel="canonical" href="https://www.n3fitbook.in/" />

  <!-- Open Graph — for Facebook, LinkedIn, WhatsApp, Slack link previews.
       Per-page hooks override og:title / og:description / og:url / og:image. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="N3FitBook" />
  <meta property="og:title" content="N3FitBook — All-in-One Gym Management Platform" />
  <meta property="og:description" content="Complete gym management software for India. Track members, billing, attendance, expenses & WhatsApp reminders from one platform." />
  <meta property="og:url" content="https://www.n3fitbook.in/" />
  <meta property="og:image" content="https://www.n3fitbook.in/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="en_IN" />

  <!-- Twitter Card — falls back to og:* when twitter:* is unset, but the
       card type itself is mandatory. -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="N3FitBook — All-in-One Gym Management Platform" />
  <meta name="twitter:description" content="Complete gym management software for India. Members, billing, WhatsApp reminders — one platform." />
  <meta name="twitter:image" content="https://www.n3fitbook.in/og-image.png" />

  <!-- Google Search Console verification slot. Set REACT_APP_GSC_VERIFICATION
       in .env to the value Search Console gives you under "HTML tag" method.
       CRA leaves the placeholder verbatim if the env var is unset. -->
  <meta name="google-site-verification" content="%REACT_APP_GSC_VERIFICATION%" />

  <!-- Preconnect to the API origin so the TLS handshake + DNS lookup happen
       in parallel with HTML parsing. Browsers extract the origin from the
       full URL substituted by CRA at build time. -->
  <link rel="preconnect" href="%REACT_APP_API_BASE_URL%" crossorigin />
  <link rel="dns-prefetch" href="%REACT_APP_API_BASE_URL%" />

  <!-- Google Fonts: declared in <head> as <link> rather than CSS @import so the
       browser can begin downloading the font CSS in parallel with the rest of
       the document, instead of waiting for landing.css to fully load. Only the
       weights we actually use are requested (Space Grotesk 400/600 for body
       and headings; Inter 600 for the navbar wordmark). -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&family=Inter:wght@600&display=swap" />

  <!-- Favicons. /favicon.ico is the legacy convention crawlers (Google Search,
       social previews) request first; without a real file there, the SPA fallback
       returns index.html and Google falls back to the generic globe icon. -->
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png" />
  <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/n3fitbook.svg" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/n3fitbook-192.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <!-- RSS feed for the in-app blog. Discoverable by feed readers and
       Google's structured-data crawler. -->
  <link rel="alternate" type="application/rss+xml" title="N3FitBook Blog" href="%PUBLIC_URL%/rss.xml" />

  <!-- ── Site-wide JSON-LD ─────────────────────────────────────────────
       Static here so crawlers always see them on initial HTML load,
       independent of JS execution. Per-page schemas (SoftwareApplication,
       FAQPage, BreadcrumbList, Article) are injected at runtime by the
       useStructuredData hook from each page component.

       IMPORTANT: keep these in sync with src/shared/seo/schemas.js
       (organizationSchema and webSiteSchema). If a social handle, contact
       email, or address ever changes, update both files in the same diff. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "@id": "https://www.n3fitbook.in/#organization",
    "name": "N3FitBook",
    "legalName": "N3FitBook",
    "url": "https://www.n3fitbook.in",
    "logo": "https://www.n3fitbook.in/n3fitbook-512.png",
    "image": "https://www.n3fitbook.in/og-image.png",
    "description": "Complete gym management software for India — members, billing, attendance, expenses & WhatsApp reminders in one platform.",
    "sameAs": [
      "https://www.instagram.com/n3fitbook"
    ],
    "parentOrganization": {
      "@type": "Organization",
      "name": "N3 Global Tech",
      "url": "https://www.n3global.tech",
      "sameAs": [
        "https://x.com/N3Globaltech",
        "https://www.instagram.com/n3globaltech",
        "https://www.linkedin.com/company/n3-global-tech"
      ]
    },
    "contactPoint": {
      "@type": "ContactPoint",
      "email": "contact@n3global.tech",
      "contactType": "customer support",
      "areaServed": "IN",
      "availableLanguage": ["English", "Hindi", "Malayalam"]
    },
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Kannur",
      "addressRegion": "Kerala",
      "addressCountry": "IN"
    }
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "@id": "https://www.n3fitbook.in/#website",
    "url": "https://www.n3fitbook.in",
    "name": "N3FitBook",
    "description": "Gym management software for India.",
    "publisher": { "@id": "https://www.n3fitbook.in/#organization" },
    "inLanguage": "en-IN"
  }
  </script>
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="N3FitBook" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- iOS launch images. Generated by scripts/generate-splash.js — #262626
       canvas with centered logo, matches manifest.background_color so there
       is no flash between launch and the in-app sidebar. Regenerate with
       `npm run generate-splash` whenever the brand logo changes. -->
  <link rel="apple-touch-startup-image" href="%PUBLIC_URL%/splash/iphone-14-pro-max.png"
        media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="%PUBLIC_URL%/splash/iphone-14-pro.png"
        media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="%PUBLIC_URL%/splash/iphone-14-plus.png"
        media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="%PUBLIC_URL%/splash/iphone-14.png"
        media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="%PUBLIC_URL%/splash/iphone-13-mini.png"
        media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="%PUBLIC_URL%/splash/iphone-11-pro-max.png"
        media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="%PUBLIC_URL%/splash/iphone-11.png"
        media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="%PUBLIC_URL%/splash/iphone-8-plus.png"
        media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="%PUBLIC_URL%/splash/iphone-8.png"
        media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="%PUBLIC_URL%/splash/ipad-pro-12.png"
        media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="%PUBLIC_URL%/splash/ipad-pro-11.png"
        media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="%PUBLIC_URL%/splash/ipad-mini.png"
        media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />



  <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
  <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
  <title>N3FitBook | Gym Management</title>

  <!-- Inline app-shell skeleton. Paints before the React bundle parses, so the
       user sees structure within ~50 ms of HTML response instead of a blank
       screen. React mounts into #root and replaces it. Stays in sync with the
       real AppLayout grid (collapsed sidebar + topbar) so there's no layout
       shift on hand-off. -->
  <style>
    html,body{margin:0;padding:0;background:#f9fafb;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
    @media (prefers-color-scheme: dark){html,body{background:#0d0d0d;color:#e5e7eb}}
    #root:empty::before{
      content:"";
      position:fixed;inset:0;
      background:
        linear-gradient(#262626,#262626) left top / 72px 100% no-repeat,
        linear-gradient(#ffffff,#ffffff) 72px top / calc(100% - 72px) 64px no-repeat;
    }
    @media (prefers-color-scheme: dark){
      #root:empty::before{
        background:
          linear-gradient(#1a1a1a,#1a1a1a) left top / 72px 100% no-repeat,
          linear-gradient(#111827,#111827) 72px top / calc(100% - 72px) 64px no-repeat;
      }
    }
    #root:empty::after{
      content:"";
      position:fixed;left:50%;top:50%;width:36px;height:36px;margin:-18px 0 0 -18px;
      border:3px solid #e5e7eb;border-top-color:#262626;border-radius:50%;
      animation:n3spin .8s linear infinite;
    }
    @keyframes n3spin{to{transform:rotate(360deg)}}
  </style>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>

</body>

</html>
